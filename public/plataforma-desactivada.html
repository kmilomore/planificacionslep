<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma desactivada</title>
    <style>
      :root {
        --bg: #f3f5f7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 65%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      .panel {
        width: min(92vw, 560px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 12px 28px rgba(17, 24, 39, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.45rem, 1.2rem + 1.2vw, 2rem);
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="panel" role="main" aria-live="polite">
      <h1>plataform desactivada sin accesos</h1>
      <p>Este portal no se encuentra disponible en este momento.</p>
    </main>
  </body>
</html>
