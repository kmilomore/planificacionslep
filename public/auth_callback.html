<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<script>
  try {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const idToken = params.get('id_token');
    const error   = params.get('error');

    if (idToken) {
      sessionStorage.setItem('google_auth_result',
        JSON.stringify({ type: 'GOOGLE_AUTH_SUCCESS', idToken }));
    } else {
      sessionStorage.setItem('google_auth_result',
        JSON.stringify({ type: 'GOOGLE_AUTH_ERROR', error: error || 'Sin token' }));
    }
  } catch (e) {
    sessionStorage.setItem('google_auth_result',
      JSON.stringify({ type: 'GOOGLE_AUTH_ERROR', error: e.message }));
  }

  // Redirect sin dejar auth_callback en el historial
  window.location.replace('/login');
</script>
</body>
</html>
